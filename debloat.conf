# firetv-declutter package groups
#
# Format:
#   @group <id> <recommended> <title>
#       <recommended> is "disable" (turned off in the Recommended preset)
#       or "keep" (left alone unless you choose Customize and turn it off)
#   <package.name>   # optional comment
#
# Every package here is DISABLED (pm disable-user), never uninstalled, and
# the restore script turns it back on. Packages that are not on a given TV
# are skipped, and packages Amazon protects are reported and skipped.
#
# The tool only ever touches packages listed in this file.
# Never add: com.amazon.tv.launcher, com.amazon.venezia (Appstore),
# com.amazon.tv.settings*, com.droidlogic*, *tvinput*, com.amazon.firebat
# (Prime Video), com.amazon.tv.ime (keyboard), or anything for Wi-Fi/Bluetooth.

@group ads disable Ads and viewing tracking (ad ID, content recognition)
com.amazon.tv.acr                          # Automatic content recognition: tracks what is on screen, incl. HDMI
com.amazon.hybridadidservice               # Advertising ID
com.amazon.ftvads.deeplinking              # Ad deep links (protected on some models)

@group telemetry disable Telemetry, metrics and log uploaders
com.amazon.device.metrics                  # (protected on some models)
com.amazon.tv.fw.metrics
com.amazon.wirelessmetrics.service
com.amazon.perfcollection
com.amazon.device.crashmanager             # (protected on some models)
com.amazon.device.logmanager               # (protected on some models)
com.amazon.dp.logger
com.amazon.neo.minerva.logcat

@group autoplay disable Autoplaying previews, demo content, tutorials, release notes
com.amazon.sneakpeek
com.amazon.tv.democontent.provider
com.amazon.storm.lightning.tutorial
com.amazon.tmm.tutorial
com.amazon.tv.releasenotes

@group shopping disable Amazon shopping on the TV
com.amazon.shoptv.client
com.amazon.shoptv.firetv.client

@group games disable Amazon games hub
com.amazon.gamehub

@group minitv disable Amazon miniTV (India-only service)
com.amazon.minitv.android.app

@group alexa keep Alexa voice (mic button on the remote, voice search)
com.amazon.vizzini
com.amazon.vizzini.ftvcds
com.amazon.tv.alexaalerts
com.amazon.tv.alexanotifications
com.amazon.alexa.externalmediaplayer.fireos
com.amazon.alexamediaplayer.runtime.ftv
com.amazon.spotify.mediabrowserservice
com.amazon.wha.mediabrowserservice
com.amazon.firetv.androidskillconnectioncapability

@group mirroring keep Screen mirroring from Android phones and PCs (Miracast). AirPlay is never touched.
com.amazon.cast.sink

@group smarthome keep Smart home control, Matter, cameras and video calls
com.amazon.tv.matter
com.amazon.tv.mattercohost
com.amazon.rtcsessioncontroller

@group musicphotos keep Amazon Music and Amazon Photos (incl. photo screensaver)
com.amazon.bueller.music
com.amazon.bueller.photos

@group kids keep Amazon Kids profiles
com.amazon.tahoe

@group silk keep Silk web browser
com.amazon.cloud9
